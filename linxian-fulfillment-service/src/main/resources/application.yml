server:
  port: 8085

spring:
  application:
    name: linxian-fulfillment-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/linxian_fulfillment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Elasticsearch 连接（官方 elasticsearch-java 客户端，安全认证默认关闭）
elasticsearch:
  host: 127.0.0.1
  port: 9200
  scheme: http

# 分拣线程池参数（3.2s -> 0.8s 的核心调优点）
sort:
  pool:
    core-size: 8
    max-size: 16
    queue-capacity: 200
    keep-alive-seconds: 60
  item-millis: 800   # 单件分拣模拟耗时（串行 4 件 3.2s -> 并发 0.8s）
  fail-rate: 0.0     # 分拣失败率（演示异常补偿/ES 检索时可调为 0.1）

# 履约异常定时补偿间隔（毫秒）
fulfillment:
  compensate-interval-ms: 30000
